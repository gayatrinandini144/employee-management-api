version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: employee-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: employeedb
      POSTGRES_USER: employee_user
      POSTGRES_PASSWORD: employee_pass
    ports:
      - "5432:5432"
    volumes:
      - employee_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_user -d employeedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: employee-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: employeedb
      DB_USER: employee_user
      DB_PASSWORD: employee_pass
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  employee_db_data:
